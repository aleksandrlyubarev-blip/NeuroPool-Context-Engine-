name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # golden tests are excluded by default (pytest.ini); they need
      # GEMINI_API_KEY and the anonymized golden letters.
      - run: pytest -q
