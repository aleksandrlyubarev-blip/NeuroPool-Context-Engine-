name: deploy

# Deploy by tag (ТЗ п.3): push a tag like v1.0.0 to release.
on:
  push:
    tags: ["v*"]

env:
  REGION: me-west1
  SERVICE: polingvo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 512Mi \
            --set-env-vars "GEMINI_MODEL=${{ vars.GEMINI_MODEL || 'gemini-flash-latest' }},USE_FIRESTORE=true,GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }},STRIPE_PAYMENT_LINK_URL=${{ secrets.STRIPE_PAYMENT_LINK_URL }}" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest"
